#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline (not upstream
# duckdb/extension-ci-tools) so the build picks up Haybarn's R2-backed ccache,
# pre-built GHCR images, and 4.13.6 toolchain. The override_duckdb_repository
# input points the clone at Query-farm-haybarn/haybarn so the extension links
# against the Haybarn engine.
#
name: Main Extension Distribution Pipeline
on:
  # push:  # Haybarn: disabled — built via core engine haybarn-extensions.yml SHA pin
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

# Pinned SHA of Query-farm-haybarn/haybarn-extension-ci-tools (haybarn branch).
# Bump when picking up new ccache/vcpkg fixes from the fork.
env:
  HAYBARN_CI_TOOLS_REF: a4821139367c0a18b4e449de8c8235337404697c

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@a4821139367c0a18b4e449de8c8235337404697c
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      extension_name: iceberg
      duckdb_version: d13a3403b3ded9035a4ee84e9601138670ae51b5
      ci_tools_version: a4821139367c0a18b4e449de8c8235337404697c
      exclude_archs: 'windows_amd64_mingw'
      extra_toolchains: 'python3'
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@a4821139367c0a18b4e449de8c8235337404697c
    secrets: inherit
    with:
      extension_name: iceberg
      duckdb_version: d13a3403b3ded9035a4ee84e9601138670ae51b5
      ci_tools_version: a4821139367c0a18b4e449de8c8235337404697c
      exclude_archs: 'windows_amd64_mingw'
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
