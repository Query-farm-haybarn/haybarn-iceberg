#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline
# (Query-farm-haybarn/haybarn-extension-ci-tools, haybarn-2.0 branch) so the build
# runs in haybarn-ci images with Haybarn's R2-backed ccache, links the Haybarn
# engine (override_duckdb_repository), and deploys with the Haybarn signing key.
# duckdb_version is the Haybarn engine release tag; ci_phase maps it to the
# embedded v2.0.0 version. The engine's haybarn-extensions.yml is the canonical
# builder, so push is disabled here.
# 2.0 platforms: no wasm_mvp, osx_amd64 or windows_arm64.
#
name: Main Extension Distribution Pipeline
on:
  # push:  # Haybarn: disabled — built via core engine haybarn-extensions.yml SHA pin
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@93efd132ded18564358b46da67818a3b904e6850
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      extension_name: &ext_name iceberg
      duckdb_version: &duckdb_ref haybarn-v2.0.0-rc6
      ci_tools_version: &ci_tools_ref 93efd132ded18564358b46da67818a3b904e6850
      exclude_archs: 'wasm_mvp;osx_amd64;windows_arm64;windows_amd64_mingw'
      extra_toolchains: 'python3'
      # Service-backed catalog tests run in BuildIceberg.yml's dedicated Linux jobs.
      # Slow tests run in the fixture catalog workflows.
      test_config: '{"test_env_variables": {"T": "\"test/*\" \"exclude:*.test_slow\""}}'
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: &ci_tools_repo 'Query-farm-haybarn/haybarn-extension-ci-tools'

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@93efd132ded18564358b46da67818a3b904e6850
    secrets: inherit
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      override_ci_tools_repository: *ci_tools_repo
      exclude_archs: 'wasm_mvp;osx_amd64;windows_arm64;windows_amd64_mingw'
      deploy_latest: ${{ github.ref == 'refs/heads/haybarn-2.0' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/haybarn-2.0' }}

  code-quality-check:
    name: Code Quality Check
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_code_quality.yml@93efd132ded18564358b46da67818a3b904e6850
    with:
      extension_name: *ext_name
      duckdb_version: *duckdb_ref
      ci_tools_version: *ci_tools_ref
      override_ci_tools_repository: *ci_tools_repo
      format_checks: format
      extra_toolchains: 'python3'
